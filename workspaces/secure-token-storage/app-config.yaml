app:
  title: Secure Token Storage Test Host
  baseUrl: http://localhost:3000
  packages: all

organization:
  name: Red Hat

backend:
  baseUrl: http://localhost:7007
  auth:
    externalAccess:
      - type: static
        options:
          # Local development-only credential used by SonataFlow notifications.
          token: bXljdXJscGFzc3dkCg== # NOSONAR
          subject: my-external-feed
  listen:
    port: 7007
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: better-sqlite3
    connection: ':memory:'

auth:
  environment: development
  providers:
    guest: {}
    github:
      development:
        clientId: ${GITHUB_CLIENT_ID}
        clientSecret: ${GITHUB_CLIENT_SECRET}
        signIn:
          resolvers:
            - resolver: usernameMatchingUserEntityName

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Resource, Location, User, Group, Template]
  locations:
    # Local example data, file locations are relative to the backend process, typically `packages/backend`
    - type: file
      target: ../../examples/entities.yaml

    # Local example templates
    - type: file
      target: ../../examples/template/create-pr-with-catalog-info.yaml
      rules:
        - allow: [Template]

    # Local example organizational data
    - type: file
      target: ../../examples/org.yaml
      rules:
        - allow: [User, Group]

    ## Uncomment these lines to add more example data
    # - type: url
    #   target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/all.yaml

    ## Uncomment these lines to add an example org
    - type: url
      target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/acme-corp.yaml
      rules:
        - allow: [User, Group]

orchestrator:
  # The sample starts SonataFlow as a Podman container.
  sonataFlowService:
    runtime: podman
    baseUrl: http://localhost
    port: 8899
    autoStart: true
    # This is a local development-only value, matching the upstream example.
    notificationsBearerToken: bXljdXJscGFzc3dkCg== # NOSONAR
    # Podman containers reach the host backend through this hostname.
    notificationsUrl: http://host.containers.internal:7007
    workflowsSource:
      gitRepositoryUrl: https://github.com/rhdhorchestrator/backstage-orchestrator-workflows.git
      localPath: ./.devModeTemp/repository
  dataIndexService:
    url: http://localhost:8899

secureTokenStorage:
  enabled: true
  allowedCallerSubjects:
    - sonataflow
  oauth:
    consentUrl: http://localhost:3000/secure-token-storage
    allowedRedirectUris:
      - http://localhost:7007/api/secure-token-storage/connections/github/callback
      - http://localhost:7007/api/secure-token-storage/connections/microsoft/callback
  encryption:
    activeKey: ${SECURE_TOKEN_STORAGE_ENCRYPTION_KEY}
